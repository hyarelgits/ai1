<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTCUSD AI Pro - Binance Live</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080a0e;color:#e6e6e6;font-family:'JetBrains Mono',monospace;overflow-x:hidden}
.header{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;background:#0f1219;border-bottom:1px solid #1e232f}
.live-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.chart-wrap{position:relative;width:100%;height:62vh;min-height:560px;background:#0a0d14;border:1px solid #1e232f;margin:10px;border-radius:12px;overflow:hidden;cursor:pointer}
#tradingview_chart{width:100%;height:100%}
.tp-overlay{position:absolute;left:0;right:0;pointer-events:none;z-index:5;top:0;height:100%}
.tp-line{position:absolute;left:0;right:0;height:1px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;font-weight:700}
.tp-label{padding:3px 8px;border-radius:4px;color:#000;font-size:10px}
.price-ticker{display:flex;gap:10px;padding:10px 14px;flex-wrap:wrap}
.price-box{background:#11151f;border:1px solid #1e232f;padding:8px 14px;border-radius:8px;min-width:115px}
.price-box span{display:block;font-size:10px;opacity:.6}
.price-box b{font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:999;display:none;padding:10px}
.modal.show{display:block}
.modal .chart-wrap{height:94vh;margin:0}
.close-modal{position:absolute;top:14px;right:18px;z-index:1000;background:#1e232f;color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <div><span class="live-dot"></span> <b>BINANCE LIVE</b> <span id="syncStatus" style="font-size:11px;color:#00ff88;margin-left:8px">● SYNCED BINANCE LIVE - SAME CHART</span></div>
  <div id="btcPrice" style="font-size:18px;font-weight:800;color:#00ff88">$--</div>
</div>

<div class="price-ticker">
  <div class="price-box"><span>ENTRY</span><b id="entryPrice">--</b></div>
  <div class="price-box" style="border-color:#00ff88"><span>TP1 +0.45%</span><b id="tp1Price" style="color:#00ff88">--</b></div>
  <div class="price-box" style="border-color:#00d9ff"><span>TP2 +0.88%</span><b id="tp2Price" style="color:#00d9ff">--</b></div>
  <div class="price-box" style="border-color:#a855f7"><span>TP3 +1.55%</span><b id="tp3Price" style="color:#a855f7">--</b></div>
  <div class="price-box" style="border-color:#ff3b3b"><span>ESL SL -0.64%</span><b id="slPrice" style="color:#ff3b3b">--</b></div>
</div>

<div class="chart-wrap" id="mainChartWrap" onclick="openFull()">
  <div id="tradingview_chart"></div>
  <div id="tpOverlay" class="tp-overlay"></div>
  <div style="position:absolute;bottom:8px;right:12px;background:rgba(0,0,0,.7);padding:5px 10px;border-radius:6px;font-size:10px;z-index:6">Click chart for FULL VIEW ↗</div>
</div>

<div class="modal" id="fullModal">
  <button class="close-modal" onclick="closeFull()">✕ Close Full View</button>
  <div class="chart-wrap enlarged" style="cursor:default;height:94vh">
    <div id="tradingview_full" style="width:100%;height:100%"></div>
  </div>
</div>

<script>
let currentPrice = 82129;
let entryPrice = 82129;

function updateTP() {
  const tp1 = entryPrice * 1.0045;
  const tp2 = entryPrice * 1.0088;
  const tp3 = entryPrice * 1.0155;
  const sl = entryPrice * 0.9936;
  document.getElementById('entryPrice').innerText = '$'+entryPrice.toFixed(2);
  document.getElementById('tp1Price').innerText = '$'+tp1.toFixed(2);
  document.getElementById('tp2Price').innerText = '$'+tp2.toFixed(2);
  document.getElementById('tp3Price').innerText = '$'+tp3.toFixed(2);
  document.getElementById('slPrice').innerText = '$'+sl.toFixed(2);
  const lines = [
    {price: tp3, label:'TP3 +1.55%', color:'#a855f7', top:'18%'},
    {price: tp2, label:'TP2 +0.88%', color:'#00d9ff', top:'32%'},
    {price: tp1, label:'TP1 +0.45%', color:'#00ff88', top:'44%'},
    {price: entryPrice, label:'ENTRY', color:'#ffffff', top:'50%'},
    {price: sl, label:'ESL SL -0.64%', color:'#ff3b3b', top:'68%'},
  ];
  document.getElementById('tpOverlay').innerHTML = lines.map(l=>`
    <div class="tp-line" style="top:${l.top};border-top:1px dashed ${l.color};color:${l.color}">
      <span class="tp-label" style="background:${l.color}">${l.label} - $${l.price.toFixed(2)}</span>
      <span style="background:#000000aa;padding:2px 6px;border-radius:4px;color:${l.color}">$${l.price.toFixed(2)}</span>
    </div>
  `).join('');
}

new TradingView.widget({
  autosize: true,
  symbol: "BINANCE:BTCUSDT",
  interval: "5",
  timezone: "Etc/UTC",
  theme: "dark",
  style: "1",
  locale: "en",
  toolbar_bg: "#0a0d14",
  enable_publishing: false,
  allow_symbol_change: true,
  container_id: "tradingview_chart",
  studies: ["MAExp@tv-basicstudies","RSI@tv-basicstudies"]
});

function openFull(){
  document.getElementById('fullModal').classList.add('show');
  setTimeout(()=>{
    document.getElementById('tradingview_full').innerHTML='';
    new TradingView.widget({
      autosize: true,
      symbol: "BINANCE:BTCUSDT",
      interval: "5",
      timezone: "Etc/UTC",
      theme: "dark",
      style: "1",
      locale: "en",
      toolbar_bg: "#0a0d14",
      enable_publishing: false,
      allow_symbol_change: true,
      container_id: "tradingview_full",
      studies: ["MAExp@tv-basicstudies","RSI@tv-basicstudies","MACD@tv-basicstudies"]
    });
  },100);
}
function closeFull(){ document.getElementById('fullModal').classList.remove('show'); }

try{
  const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
  ws.onmessage = (e)=>{
    const data = JSON.parse(e.data);
    currentPrice = parseFloat(data.p);
    entryPrice = currentPrice;
    document.getElementById('btcPrice').innerText = '$'+currentPrice.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    updateTP();
  };
}catch(err){ console.log(err); }

updateTP();
</script>
</body>
</html>
